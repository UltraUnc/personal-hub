<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Motivation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .tag {
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #58a6ff;
      margin-bottom: 16px;
      font-weight: 600;
    }
    blockquote {
      font-size: 1.4rem;
      line-height: 1.6;
      font-style: italic;
      color: #f0f6fc;
      margin-bottom: 20px;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      background-color: #238636;
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="tag" id="quote-badge">Daily Motivation</div>
    <blockquote id="quote-text">Loading quote...</blockquote>

    <div class="buttons">
      <button type="button" onclick="cycleQuote()">Next Quote</button>
    </div>
  </div>

  <script>
    const quotes = [
      "I love your butt",
      "Im just frustrated today and need some time to decompress",
      "Can you feed the cats",
      "69?",
      "Stop being stingy and lemme smell your fart!!",
      "You can use my face as your chair",
      "Even though today is a rough day, I still love you",
      "Are you taking care of your health?",
      "You better be taking care of yourself!",
      "I Love You",
      "Calm down, is it that serious?!?!",
      "Just give me a sec to decompress",
      "I miss you",
      "Make sure those 2 assholes aren't bullying my little girl",
      "Dang, theres a new VR game coming out and I should be able to play it on my laptop.",
      "Can you not abuse me today?",
      "Them titties be tittying!!",
      "Hey.....",
      "You look good",
      "Mmmmm Carters sounds good toady",
      "I wish I had thought of this sooner.",
      "Don't cry",
      "(Look at one of the pics when we got together) We were so little lol.",
      "We started with a futon in my moms townhouse lol",
      "We've been through a lot together; Moving to Mexico(EP), Covid, Our mothers, President Trump",
      "Remember when you 'Asked' to borrow a chair at OCI, cause I remember",
      "You jus threatened to stab me because i love you more than you love me",
      "Theres a secret code for you to use, FYI i created it randomly"
    ];

    let currentIndex = 0;

    function getDailyIndex() {
      const today = new Date();
      const start = new Date(today.getFullYear(), 0, 0);
      const diff = today - start;
      const oneDay = 1000 * 60 * 60 * 24;
      const dayOfYear = Math.floor(diff / oneDay);
      return dayOfYear % quotes.length;
    }

    function renderQuote(index) {
      const el = document.getElementById('quote-text');
      if (el && quotes[index]) {
        el.textContent = "“" + quotes[index] + "”";
      }
    }

    function cycleQuote() {
      currentIndex = (currentIndex + 1) % quotes.length;
      renderQuote(currentIndex);
    }

    currentIndex = getDailyIndex();
    renderQuote(currentIndex);
  </script>
</body>
</html>
